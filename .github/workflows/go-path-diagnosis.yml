name: Windows Go executable resolution diagnosis
"on":
  push:
    branches: ['verify/go-path-diagnosis-20261105']
permissions:
  contents: read
jobs:
  reproduce-go-child-launch:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOENV: 'off'
      GOFLAGS: '-mod=readonly'
      GOEXPERIMENT: ''
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
          architecture: x64
          cache: false
      - name: Reject joined Go paths and validate pinned single executable
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $found = @(Get-Command go -CommandType Application)
          [ordered]@{ prefix = '[DEBUG-go-path-a1]'; command_count = $found.Count; sources = @($found | ForEach-Object { $_.Source }) } | ConvertTo-Json -Compress
          $env:OLD_GO = (Get-Command go -CommandType Application).Source
          $goPath = Join-Path $env:GOROOT 'bin\go.exe'
          if (-not (Test-Path -LiteralPath $goPath -PathType Leaf)) { throw 'Pinned official Go executable is missing.' }
          $env:GO = $goPath
          @'
          import os, json, subprocess, sys
          go = os.environ.get('GO', 'go')
          old = os.environ['OLD_GO']
          print(json.dumps({'prefix':'[DEBUG-go-path-a1]', 'old_go':old, 'old_is_file':os.path.isfile(old), 'go':go, 'is_file':os.path.isfile(go)}), flush=True)
          env = dict(os.environ, GOTOOLCHAIN='local', GOWORK='off', GOENV='off', GOFLAGS='-mod=readonly', GOEXPERIMENT='', GOOS='windows', GOARCH='amd64', GOAMD64='v1', CGO_ENABLED='0')
          old_failed = False
          try:
              subprocess.check_output([old, 'version'], env=env, text=True)
          except FileNotFoundError as error:
              old_failed = error.winerror == 2
          assert old_failed, 'Original two-path selection must reproduce WinError 2'
          results = []
          for i in range(3):
              try:
                  output = subprocess.check_output([go, 'version'], env=env, text=True)
                  results.append({'attempt':i+1, 'ok':output.startswith('go version go1.27.3 '), 'version':output.strip()})
              except OSError as error:
                  results.append({'attempt':i+1, 'ok':False, 'kind':type(error).__name__, 'winerror':error.winerror, 'errno':error.errno})
          print(json.dumps({'prefix':'[DEBUG-go-path-a1]', 'results':results}), flush=True)
          sys.exit(0 if all(r['ok'] for r in results) else 1)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Pinned official Go path regression failed; no service operations.' }
