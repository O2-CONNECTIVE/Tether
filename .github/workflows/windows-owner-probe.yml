name: Windows isolated owner probe
on:
  pull_request:
    branches: [main]
    paths: ['tools/windows-owner-probe/**', '.github/workflows/windows-owner-probe.yml']
  push:
    branches: [main]
    paths: ['tools/windows-owner-probe/**', '.github/workflows/windows-owner-probe.yml']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  owner-probe:
    name: Fixed command creation-time ownership experiment
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require exact source checkout
        run: python scripts/check_ci_checkout.py
      - name: Run each fixed native case once
        shell: pwsh
        timeout-minutes: 2
        run: ./tools/windows-owner-probe/probe.test.ps1
