name: Windows isolated owned attach experiment
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  owned-attach:
    if: github.head_ref == 'codex/windows-owned-attach-experiment'
    name: One fixed app-owned WebView2 attach experiment
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        id: ci-checkout
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Select applicable work from complete source history
        id: ci-scope
        working-directory: ${{ github.workspace }}
        run: python scripts/ci_scope.py select --lane windows
      - name: Require and record exact source checkout
        if: steps.ci-scope.outputs.selected == 'true'
        id: ci-work-1
        working-directory: ${{ github.workspace }}
        run: python scripts/check_ci_checkout.py
      - name: Test fixed app-owner cases before actual attachment
        if: steps.ci-scope.outputs.selected == 'true'
        id: ci-work-2
        run: ./tools/windows-app-owner/app-owner.test.ps1
      - name: Read existing WebView2 and driver versions
        if: steps.ci-scope.outputs.selected == 'true'
        id: ci-work-3
        shell: pwsh
        run: ./ui/tauri/native-smoke/inventory.ps1 -OutputPath "$env:RUNNER_TEMP/native-inventory.json"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: steps.ci-scope.outputs.selected == 'true'
        id: ci-work-4
        with:
          python-version: '3.13.17'
          architecture: x64
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.ci-scope.outputs.selected == 'true'
        id: ci-work-5
        with:
          node-version: '24.22.1'
      - name: Select existing approved CI Rust version
        if: steps.ci-scope.outputs.selected == 'true'
        id: ci-work-6
        run: rustup toolchain install 1.99.1 --profile minimal --no-self-update
      - name: Prepare hash-pinned test tools in runner temp
        if: steps.ci-scope.outputs.selected == 'true'
        id: ci-work-7
        timeout-minutes: 6
        run: ./ui/tauri/native-smoke/setup.ps1 -ToolsDirectory "$env:RUNNER_TEMP/native-tools" -InventoryPath "$env:RUNNER_TEMP/native-inventory.json"
      - name: Build locked frontend
        if: steps.ci-scope.outputs.selected == 'true'
        id: ci-work-8
        working-directory: ui/tauri
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          exit $LASTEXITCODE
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.ci-scope.outputs.selected == 'true'
        id: ci-work-9
        with:
          path: |
            ~/.cargo/registry
            ui/tauri/src-tauri/target
          key: tauri-windows-rust-1.99.1-${{ hashFiles('ui/tauri/src-tauri/Cargo.lock', 'ui/tauri/src-tauri/Cargo.toml') }}
          restore-keys: tauri-windows-rust-1.99.1-
      - name: Build unchanged native shell
        if: steps.ci-scope.outputs.selected == 'true'
        id: ci-work-10
        working-directory: ui/tauri
        run: cargo +1.99.1 build --locked --manifest-path src-tauri/Cargo.toml --features custom-protocol
      - name: Compile isolated owner variant without changing native smoke
        if: steps.ci-scope.outputs.selected == 'true'
        id: ci-work-11
        timeout-minutes: 6
        run: ./tools/windows-owned-attach/build.ps1 -ToolsDirectory "$env:RUNNER_TEMP/native-tools" -OutputDirectory "$env:RUNNER_TEMP/owned-attach-build"
      - name: Run one fixed actual-app attach and close experiment
        if: steps.ci-scope.outputs.selected == 'true'
        id: ci-work-12
        timeout-minutes: 4
        run: ./tools/windows-owned-attach/run.ps1 -ToolsDirectory "$env:RUNNER_TEMP/native-tools" -BuildDirectory "$env:RUNNER_TEMP/owned-attach-build" -ApplicationPath "$env:GITHUB_WORKSPACE/ui/tauri/src-tauri/target/debug/rescue-host-shell.exe" -PrivateDirectory "$env:RUNNER_TEMP/owned-attach-private" -ResultPath "$env:RUNNER_TEMP/owned-attach-result.json"
      - name: Save only sanitized source-bound result
        if: ${{ steps.ci-scope.outputs.selected == 'true' && always() }}
        id: ci-work-13
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-owned-attach-result
          path: |
            ${{ runner.temp }}/owned-attach-result.json
            ${{ runner.temp }}/owned-attach-build/provenance.json
            ${{ runner.temp }}/owned-attach-build/build-result.json
          if-no-files-found: error
          retention-days: 7
      - name: Require applicable work or explicit non-applicability
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          CI_SCOPE_STEPS: ${{ toJSON(steps) }}
        run: python scripts/ci_scope.py gate --required ci-work-1,ci-work-2,ci-work-3,ci-work-4,ci-work-5,ci-work-6,ci-work-7,ci-work-8,ci-work-9,ci-work-10,ci-work-11,ci-work-12,ci-work-13
