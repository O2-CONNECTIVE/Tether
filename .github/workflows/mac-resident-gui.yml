name: Mac resident GUI wiring
on:
  pull_request:
    branches: [main]
    paths: ['ui/tauri/**', 'ci-producer/**', 'backend/**', '.github/workflows/mac-resident-gui.yml']
  push:
    branches: [main]
    paths: ['ui/tauri/**', 'ci-producer/**', 'backend/**', '.github/workflows/mac-resident-gui.yml']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gui:
    name: Real WebView, IPC and Go Standby (Mac ARM64)
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require exact source and disposable Mac
        run: |
          python3 scripts/check_ci_checkout.py
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 27
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 27.1'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          architecture: arm64
          cache: false
      - name: Build source-pinned Go producer composition
        env:
          GOTOOLCHAIN: local
          GOWORK: 'off'
          GOENV: 'off'
          GOFLAGS: ''
          CGO_ENABLED: '1'
        run: |
          (cd backend && go mod download && go mod verify)
          python3 -m unittest discover -s ci-producer -p 'test_*.py' -v
          python3 ci-producer/prepare_overlay.py
          producer="$RUNNER_TEMP/resident-gui-producer.test"
          (cd backend && GOPROXY=off GOSUMDB=off go test -c -mod=readonly -p=1 -tags=ci_actual_producer "-overlay=$GITHUB_WORKSPACE/ci-producer/OVERLAY.json" -o "$producer" ./internal/residentpipe)
          git diff --exit-code -- backend/go.mod backend/go.sum
          echo "CI_GUI_PRODUCER_BINARY=$producer" >> "$GITHUB_ENV"
          echo "CI_GUI_PRODUCER_SHA256=$(shasum -a 256 "$producer" | awk '{print $1}')" >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
      - name: Build reviewed frontend
        working-directory: ui/tauri
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
      - name: Select pinned Rust and build explicit CI composition
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --no-self-update
          cargo +1.99.1 fmt --manifest-path ui/tauri/src-tauri/Cargo.toml --check
          python3 -m unittest discover -s ui/tauri/src-tauri/tests/resident-gui -p 'test_*.py' -v
          cargo +1.99.1 test --lib --locked --manifest-path ui/tauri/src-tauri/Cargo.toml resident_port::duplex::tracking_tests
          cargo +1.99.1 fetch --locked --manifest-path ui/tauri/src-tauri/Cargo.toml
          RUSTFLAGS='--cfg resident_gui_fixture' cargo +1.99.1 test --lib --locked --offline --manifest-path ui/tauri/src-tauri/Cargo.toml resident_gui_
          RUSTFLAGS='--cfg resident_gui_fixture' cargo +1.99.1 build --locked --offline --manifest-path ui/tauri/src-tauri/Cargo.toml --features custom-protocol --example resident_gui_ci
      - name: Run real GUI through original owner keeper
        run: |
          umask 077
          test "$(shasum -a 256 "$CI_GUI_PRODUCER_BINARY" | awk '{print $1}')" = "$CI_GUI_PRODUCER_SHA256"
          export CI_ACTUAL_PRODUCER=1
          export CI_GUI_SOURCE_SHA="$(git rev-parse HEAD)"
          export CI_GUI_BUILD_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          binary="$GITHUB_WORKSPACE/ui/tauri/src-tauri/target/debug/examples/resident_gui_ci"
          if ! plist_sections="$(/usr/bin/otool -l "$binary" 2>/dev/null)"; then
            echo 'GUI_FIXTURE_EVENT=binary-plist-unavailable'
            exit 1
          fi
          printf '%s\n' "$plist_sections" | python3 -c 'import sys; print("GUI_FIXTURE_EVENT=binary-plist-present" if any(line.split() == ["sectname", "__info_plist"] for line in sys.stdin) else "GUI_FIXTURE_EVENT=binary-plist-absent")'
          export CI_GUI_BINARY_SHA256="$(shasum -a 256 "$binary" | awk '{print $1}')"
          run_dir=$(mktemp -d "$RUNNER_TEMP/resident-gui.XXXXXX")
          source_binary="$binary"
          python3 ui/tauri/src-tauri/tests/resident-gui/bundle.py create "$source_binary" "$run_dir"
          binary="$run_dir/TetherCurrentGUIFixture.app/Contents/MacOS/resident_gui_ci"
          export CI_PRODUCER_RESULT="$run_dir/result.json"
          export CI_PRODUCER_INVOCATION="$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
          python3 ci-producer/supervise_ci.py keeper --test-name TestCIResidentGUIWiring --invocation "$CI_PRODUCER_INVOCATION" --report "$CI_PRODUCER_RESULT" --test "$binary" --log "$run_dir/owned.log" &
          keeper=$!
          observer_status=0
          python3 ci-producer/supervise_ci.py observer --test-name TestCIResidentGUIWiring --invocation "$CI_PRODUCER_INVOCATION" --report "$CI_PRODUCER_RESULT" || observer_status=$?
          # Emit only fixed fixture stage names, never raw logs/URLs/content.
          grep -E '^GUI_FIXTURE_EVENT=(main-bundle-present|main-bundle-absent|main-bundle-identifier-present|main-bundle-identifier-absent|executable-in-app|executable-not-in-app|executable-layout-unavailable|embedded-index-present|embedded-index-empty|embedded-index-missing|navigation-root-allowed|index-response-error|index-response-empty|index-response-html|index-response-nonhtml|producer-started|source-bound|navigation-denied|page-started|page-finished|initializer-started|on-applied|off-applied|driver-passed|driver-failed|webview-created|app-built|monitor-exit-request|event-loop-start|exit-requested|exit-held|event-loop-returned|owner-joined)$' "$run_dir/owned.log" || true
          grep -E '^GUI_FIXTURE_FAILURE=((init|on|auth|off|complete):(identity|receipt|transition|retry-budget|phase-timeout|auth-timeout|bridge-timeout|unexpected)|event:(sequence|lock))$' "$run_dir/owned.log" || true
          # Read-only verification even on unknown; never replace or signal owner.
          python3 ui/tauri/src-tauri/tests/resident-gui/bundle.py verify "$source_binary" "$run_dir"
          test "$observer_status" -eq 0
          wait "$keeper"
          python3 ui/tauri/src-tauri/tests/resident-gui/bundle.py verify "$source_binary" "$run_dir"
          test "$(shasum -a 256 "$CI_GUI_PRODUCER_BINARY" | awk '{print $1}')" = "$CI_GUI_PRODUCER_SHA256"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          r = json.loads(Path(os.environ['CI_PRODUCER_RESULT']).read_text())
          assert r['outcome'] == 'passed' and r['cleanup'] == 'confirmed'
          assert r['source'] == os.environ['CI_GUI_SOURCE_SHA']
          assert r['binary_sha256'] == os.environ['CI_GUI_BINARY_SHA256']
          assert r['scope'] == 'real-webview-ipc-go-standby-loopback'
          assert r['producer_sha256'] == os.environ['CI_GUI_PRODUCER_SHA256']
          print(json.dumps(r, ensure_ascii=False))
          PY
