[package]
name = "rescue-host-shell"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = { version = "=0.3.1", default-features = false, features = ["alloc"] }
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSActionCell", "NSAlert", "NSApplication", "NSButton", "NSButtonCell", "NSCell", "NSControl", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSString"] }
tauri = { version = "=2.12.5", features = ["tray-icon"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
tauri = { version = "=2.12.5", features = ["test"] }

[features]
startup-diagnostics = []
custom-protocol = ["tauri/custom-protocol"]

[[test]]
name = "process_boundary"
path = "tests/process_boundary.rs"
harness = false
